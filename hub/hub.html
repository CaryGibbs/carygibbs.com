  const msg = (t, cls) => { const m = document.getElementById('join-msg'); m.textContent = t; m.className = 'join-msg ' + (cls || ''); };
  form.onsubmit = async e => {
    e.preventDefault();

      if (profile.classes?.[info.classId]) { msg(`You're already in ${info.className || 'this class'}.`, 'ok'); return; }
      await joinClass(user.uid, profile, info);
      logEvent('class.join', { target: info.className || '', targetId: info.classId, detail: 'With a class code' });
      const firstNew = (info.packIds || []).find(id => !packIdsFor(profile).includes(id));
      if (firstNew) { try { localStorage.setItem('clasp_pack_' + user.uid, firstNew); } catch (err) {} }
      msg(`You've joined ${info.className || 'the class'}!${info.packIds?.length ? ' Loading your revision…' : ' Your teacher hasn\'t chosen a revision pack yet.'}`, 'ok');
      showToast(`Joined ${info.className || 'class'}`, 'success');

    } catch (err) {
      console.warn('Join class failed', err);

  const ids = [...(profile.groupIds || (profile.groupId ? [profile.groupId] : []))];

/* ── Study plan: countdown, today's goal, what to focus on ───── */
function focusSubject(profile, subjects, groupId) {
  if (!subjects?.length) return null;
  const today = isoDay();
  const due = dueEntries(profile, groupId);
  const scored = subjects.map(s => {
    const ses = (profile.sessions || []).filter(x => !x.review && (x.subjectId === s.id || x.subject === s.name));
    const recent = ses.slice(-6);
    const avg = recent.length ? recent.reduce((a, x) => a + (x.pct || 0), 0) / recent.length : null;
    const dueN = due.filter(e => e.s === s.id).length;
    // days since this subject was last revised (quiz or study time)
    const lastQuiz = Math.max(0, ...ses.map(x => x.date || 0));
    const studyDays = Object.keys(profile.study || {}).filter(d => (profile.study[d] || {})[s.id] > 0).sort();
    const lastStudy = studyDays.length ? new Date(studyDays[studyDays.length - 1] + 'T12:00:00').getTime() : 0;
    const last = Math.max(lastQuiz, lastStudy);
    const since = last ? daysBetween(isoDay(new Date(last)), today) : 30;
    const score = (avg === null ? 40 : 100 - avg) + dueN * 3 + Math.min(since, 14) * 4;
    let why = [];
    if (avg !== null && avg < 65) why.push(`your average is ${Math.round(avg)}%`);
    if (dueN) why.push(`${dueN} review${dueN === 1 ? '' : 's'} due`);
    if (since >= 3) why.push(last ? `not revised for ${since} days` : 'not started yet');
    if (!why.length) why.push(avg !== null ? `keep it ticking over (${Math.round(avg)}% average)` : 'keep every subject ticking over');
    return { s, score, why };
  }).sort((a, b) => b.score - a.score);
  return scored[0];
}

/* ── Win your streak back ─────────────────────────────────── */
function durationText(m) {
  if (m === 60) return 'an hour';
  if (m === 90) return 'an hour and a half';
  if (m % 60 === 0) return `${m / 60} hours`;
  return `${m} minutes`;
}

      <div class="repair-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${REPAIR.MINUTES}" aria-valuenow="${p.mins}"><span style="width:${pct}%"></span></div>

  const st = streakStatus(profile);
  const shields = Math.min(profile.shields || 0, 2);
  document.getElementById('xp-streak-val').innerHTML  = st.current + ' <i data-icon="flame"></i>' + (shields ? ` <span title="${shields} streak shield${shields > 1 ? 's' : ''}: a missed day won't break your streak" style="font-size:0.8em">🛡️${shields > 1 ? '×' + shields : ''}</span>` : '');
  renderRepairCard(profile);
  if (st.lapsed) {
    // Streak ended: show their best and nudge them to start again
    const lbl = document.getElementById('xp-streak-label');
    lbl.textContent = `Best ${st.best} · revise today!`;
    lbl.title = `Your streak ended. Your best was ${st.best} day${st.best === 1 ? '' : 's'} in a row: revise today to start a new one.`;
  } else if (st.current >= 2 && st.current >= st.best) {
    document.getElementById('xp-streak-label').textContent = '🏆 Personal best!';
  } else if (st.best > st.current) {
    document.getElementById('xp-streak-label').textContent = `Streak · best ${st.best}`;
  }
  document.getElementById('xp-total-val').textContent   = xp + ' XP';

  setTimeout(() => {
    document.getElementById('xp-bar-fill').style.width = progress + '%';
  }, 200);

  if (next) {
    document.getElementById('xp-bar-left').textContent  = xpIntoLevel + ' / ' + xpNeeded + ' XP to ' + next.name;
    document.getElementById('xp-bar-right').textContent = next.icon + ' ' + next.name;
  } else {
    document.getElementById('xp-bar-left').textContent  = 'Max level reached!';
    document.getElementById('xp-bar-right').textContent = '';
  }

  // Goals, time, subjects and badges (shared with profile.html)
  document.getElementById('jumpbar').style.display = 'flex';
  document.getElementById('stats-root').innerHTML = statsSectionsHtml();
  document.getElementById('stats-wrap').style.display = 'block';
  const owed = renderStats(profile, { goalLimit: 4 });
  if (owed.length && user && !isPreview()) {
    updateDoc(doc(db, 'users', user.uid), { badges: [...(profile.badges || []), ...owed] }).catch(() => {});
    showToast(`${owed.length} new badge${owed.length !== 1 ? 's' : ''} unlocked!`, 'success');
  }
  // Arrived via a jump link from another page? Scroll now the sections exist.
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
<script>
window.showToast = function(msg, type='info') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`; t.textContent = msg;
  c.appendChild(t); setTimeout(() => t.remove(), 3500);
};
</script>
