<!DOCTYPE html>
<html lang="en" data-theme="edge">
<head>
  <script src="dev-flag.js?v=20261123h"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Choose your password — Lobe Limpet</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/brand/favicon.svg?v=20261123h">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/brand/favicon-32.png?v=20261123h">
  <link rel="apple-touch-icon" href="assets/images/brand/apple-touch-icon.png?v=20261123h">
  <link rel="manifest" href="manifest.webmanifest?v=20261123h">
  <link rel="stylesheet" href="theme.css?v=20261123h">
  <link rel="stylesheet" href="ui.css?v=20261123h">
  <script src="icons.js?v=20261123h"></script>
  <style>
    body { min-height:100vh; background:var(--color-bg); }
    .wrap { max-width:420px; margin:0 auto; padding:var(--space-xl) var(--space-lg); min-height:100vh; display:flex; flex-direction:column; justify-content:center; }
    .logo { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:var(--space-lg); text-decoration:none; color:var(--color-text); }
    .logo img { width:48px; height:48px; }
    .logo span { font-family:var(--font-heading); font-size:2rem; font-weight:800; letter-spacing:-0.02em; }
    .logo b { color:var(--color-primary); }
    h1 { font-size:1.4rem; margin:0 0 6px; }
    .muted { color:var(--color-text-muted); font-size:0.92rem; line-height:1.5; margin:0 0 var(--space-md); }
    .form-group { margin-bottom:var(--space-md); }
    .form-group label { display:block; font-family:var(--font-ui); font-size:0.85rem; font-weight:600; color:var(--color-text-muted); margin-bottom:6px; }
    .form-group input { width:100%; padding:14px var(--space-md); border-radius:var(--radius-button); font-size:1rem; box-sizing:border-box; }
    .pw-btn { background:none; border:1px solid var(--color-border); border-radius:8px; padding:4px 10px; font:inherit; font-size:0.8rem; font-weight:600; color:var(--color-text-muted); cursor:pointer; margin-top:6px; }
    .btn-wide { width:100%; padding:14px; font-size:1rem; }
    .msg { margin-top:var(--space-md); font-size:0.9rem; line-height:1.45; }
    .msg.err { color:var(--color-danger); }
    .foot { text-align:center; margin-top:var(--space-lg); font-size:0.85rem; }
    .foot a { color:var(--color-text-muted); }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
<main class="wrap">
  <a class="logo" href="./"><img src="assets/images/brand/favicon.svg?v=20261123h" alt=""><span>lobe <b>limpet</b></span></a>
  <div class="card">
    <!-- Checking the link -->
    <div id="v-check"><p class="muted">Checking your link…</p></div>

    <!-- Choose a password -->
    <form id="v-set" hidden>
      <h1>Choose your password</h1>
      <p class="muted">For <strong id="who"></strong></p>
      <div class="form-group">
        <label for="pw1">New password</label>
        <input type="password" id="pw1" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="At least 8 characters">
        <button type="button" class="pw-btn" id="show">Show</button>
      </div>
      <div class="form-group">
        <label for="pw2">Type it again</label>
        <input type="password" id="pw2" autocomplete="new-password" maxlength="128" required>
      </div>
      <button class="btn btn-primary btn-wide" id="save" type="submit">Save and sign in</button>
      <p class="msg err" id="set-err" role="alert"></p>
    </form>

    <!-- The link has expired or was already used -->
    <form id="v-old" hidden>
      <h1>This link has run out</h1>
      <p class="muted">Links work for one hour and only once. Enter your email and we'll send you a new one.</p>
      <div class="form-group">
        <label for="em">Email</label>
        <input type="email" id="em" autocomplete="email" required placeholder="you@example.com">
      </div>
      <button class="btn btn-primary btn-wide" id="resend" type="submit">Send me a new link</button>
      <p class="msg" id="old-msg" role="status"></p>
    </form>
  </div>
  <p class="foot"><a href="login.html">Go to sign in</a> · <a href="help.html">Help</a></p>
</main>

<script type="module">
  import { auth } from './firebase-config.js?v=20261123h';
  import { redirectByRole } from './auth.js?v=20261123h';
  import { sendPasswordEmail } from './mail.js?v=20261123h';
  import { verifyPasswordResetCode, confirmPasswordReset, signInWithEmailAndPassword }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const $ = id => document.getElementById(id);
  const show = id => ['v-check', 'v-set', 'v-old'].forEach(v => { $(v).hidden = v !== id; });
  const code = new URLSearchParams(location.search).get('oobCode') || '';
  // Take the code out of the address bar, so it isn't left in history or shared by accident
  history.replaceState(null, '', location.pathname);

  let email = '';
  if (!code) show('v-old');
  else verifyPasswordResetCode(auth, code)
    .then(e => { email = e; $('who').textContent = e; show('v-set'); $('pw1').focus(); })
    .catch(() => show('v-old'));

  $('show').onclick = () => {
    const on = $('pw1').type === 'password';
    $('pw1').type = $('pw2').type = on ? 'text' : 'password';
    $('show').textContent = on ? 'Hide' : 'Show';
  };

  $('v-set').onsubmit = async (ev) => {
    ev.preventDefault();
    const pw = $('pw1').value, err = $('set-err');
    err.textContent = '';
    if (pw.length < 8) { err.textContent = 'Use at least 8 characters.'; return; }
    if (pw !== $('pw2').value) { err.textContent = "The two passwords don't match."; return; }
    $('save').disabled = true; $('save').textContent = 'Saving…';
    try {
      await confirmPasswordReset(auth, code, pw);
    } catch (e) {
      $('save').disabled = false; $('save').textContent = 'Save and sign in';
      if (/expired|invalid-action-code/.test(e.code || '')) { show('v-old'); return; }
      err.textContent = e.code === 'auth/weak-password' ? 'That password is too easy to guess. Try a longer one.' : "Your password couldn't be saved. Please try again.";
      return;
    }
    try {
      const cred = await signInWithEmailAndPassword(auth, email, pw);
      await redirectByRole(cred.user.uid);
    } catch (e) {
      location.href = 'login.html';   // password saved: they can sign in there
    }
  };

  $('v-old').onsubmit = async (ev) => {
    ev.preventDefault();
    const e = $('em').value.trim().toLowerCase(), msg = $('old-msg');
    if (!e) return;
    $('resend').disabled = true; msg.className = 'msg'; msg.textContent = 'Sending…';
    try {
      await sendPasswordEmail(e);
      msg.textContent = `If there's a Lobe Limpet account for ${e}, a new link is on its way. Check spam (or the "Other" tab in Outlook) if it hasn't arrived in a few minutes.`;
    } catch (x) {
      msg.className = 'msg err'; msg.textContent = x.shown || "We couldn't send it just now. Please try again.";
      $('resend').disabled = false;
    }
  };
</script>
</body>
</html>
