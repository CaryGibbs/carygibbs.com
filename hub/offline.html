<html lang="en">

  <title>Lobe Limpet: you're offline</title>
  <meta name="theme-color" content="#123a4a">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #d4f1ea; color: #123a4a; font: 16px/1.5 Inter, system-ui, -apple-system, sans-serif; padding: 24px; box-sizing: border-box; }
    .card { background: #fff; border-radius: 18px; padding: 32px 28px; max-width: 380px; text-align: center;

    h1 { font-size: 1.35rem; margin: 16px 0 8px; }
    p { margin: 0 0 20px; color: #3d5d6a; }

  </style>

<body>
  <div class="card">
    <img src="assets/images/brand/icon-192.png" alt="">
    <h1>You're offline</h1>

    <button type="button" onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
