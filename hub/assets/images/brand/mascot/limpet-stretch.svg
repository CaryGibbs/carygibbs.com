<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -14 108 114" role="img" aria-label="Lobe Limpet trying to jump but staying stuck to its rock">
<style>
.body { transform-box: view-box; transform-origin: 50px 84px; }
.eye { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
.shadow { transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.1); } }

.body { animation: stretch 3.4s cubic-bezier(.3,.7,.4,1) infinite; }
.open { animation: o 3.4s infinite; } .shut { animation: s 3.4s infinite; opacity: 0; }
.drop { opacity: 0; animation: drop 3.4s infinite; }
.boing { opacity: 0; transform-box: fill-box; transform-origin: center; animation: boing 3.4s infinite; }
@keyframes stretch { 0%,10% { transform: scale(1,1); } 18% { transform: scale(1.08,.9); } 40% { transform: scale(.86,1.32); }
  48% { transform: scale(.88,1.3); } 54% { transform: scale(1.12,.86); } 62% { transform: scale(.96,1.06); } 70% { transform: scale(1.02,.98); } 78%,100% { transform: scale(1,1); } }
@keyframes o { 0%,24%,58%,100% { opacity: 1; } 28%,54% { opacity: 0; } }
@keyframes s { 0%,24%,58%,100% { opacity: 0; } 28%,54% { opacity: 1; } }
@keyframes drop { 0%,30% { opacity: 0; transform: translate(0,0); } 36%,50% { opacity: 1; } 60%,100% { opacity: 0; transform: translate(4px,8px); } }
@keyframes boing { 0%,52% { opacity: 0; transform: scale(.5); } 58% { opacity: 1; transform: scale(1.1); } 72%,100% { opacity: 0; transform: scale(1); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
