<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -14 140 114" role="img" aria-label="Lobey holding up a gem">
<style>
.body { transform-box: view-box; transform-origin: 50px 84px; animation: bob 2.6s ease-in-out infinite; }
.eye { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
.shadow { transform-box: fill-box; transform-origin: center; }
.armT { transform-box: view-box; transform-origin: 90px 66px; animation: lift 2.6s ease-in-out infinite; }
.tag { transform-box: view-box; transform-origin: 106px 37px; animation: tilt 2.6s ease-in-out infinite; }
.glint { transform-box: fill-box; transform-origin: center; animation: twinkle 1.3s ease-in-out infinite; }
.spk { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
.spk.s2 { animation-delay: 1.1s; }
@keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.1); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes lift { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
@keyframes tilt { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@keyframes twinkle { 0%,100% { transform: scale(.4) rotate(0deg); opacity: .2; } 40%,60% { transform: scale(1) rotate(20deg); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
