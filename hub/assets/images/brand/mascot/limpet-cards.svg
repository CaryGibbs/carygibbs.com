<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -14 108 114" role="img" aria-label="Lobey with a stack of flashcards">
<style>
.body { transform-box: view-box; transform-origin: 50px 84px; }
.eye { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
.shadow { transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.1); } }

.body { animation: sway 4s ease-in-out infinite; }
.pupil { animation: read 4s ease-in-out infinite; }
.stack { transform-box: view-box; transform-origin: 50px 92px; animation: hold 3.6s ease-in-out infinite; }
.top { transform-box: view-box; transform-origin: 50px 90px; animation: deal 3.6s ease-in-out infinite; }
.tick { opacity: 0; animation: tick 3.6s ease-in-out infinite; }
.fold { animation: think 4s ease-in-out infinite; }
.f2 { animation-delay: .2s; } .f3 { animation-delay: .4s; } .f4 { animation-delay: .6s; } .f5 { animation-delay: .8s; }
@keyframes sway { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
@keyframes read { 0%,8% { transform: translate(-2.2px,3.4px); } 32% { transform: translate(2.2px,3.4px); } 38% { transform: translate(-2.2px,4px); } 64% { transform: translate(2.2px,4px); } 74%,100% { transform: translate(-2.2px,3.4px); } }
@keyframes hold { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-1.5deg); } }
@keyframes deal { 0%,55% { transform: none; } 68% { transform: translate(14px,-12px) rotate(14deg); } 80% { transform: translate(0,-4px) rotate(-2deg); } 90%,100% { transform: none; } }
@keyframes tick { 0%,20% { opacity: 0; } 30%,55% { opacity: 1; } 62%,100% { opacity: 0; } }
@keyframes think { 0%,70%,100% { stroke: #c94a28; } 85% { stroke: #ffd36b; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
