40" height="27" rx="4" fill="#fff" stroke="#123a4a" stroke-opacity=".35"/><text x="50" y="84.5" text-anchor="middle" font-family="Fredoka, Arial Rounded MT Bold, Arial, sans-serif" font-weight="700" font-size="14" fill="#2a9d8f">?</text><path class="tick" d="M58 72 l2.5 2.5 l5 -5" fill="none" stroke="#2a9d8f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><ellipse cx="29" cy="83" rx="4.2" ry="5.5" fill="#ff7a59" stroke="#c94a28" stroke-width="2"/><ellipse cx="71" cy="83" rx="4.2" ry="5.5" fill="#ff7a59" stroke="#c94a28" stroke-width="2"/></g></g>
