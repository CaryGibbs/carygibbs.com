 class="heart" d="M84 56 C80 51 74 55 79 60 L84 64 L89 60 C94 55 88 51 84 56 Z" fill="#ff7a59"/><path class="heart h2" d="M94 50 C91.5 47 88 49.5 91 52.5 L94 55 L97 52.5 C100 49.5 96.5 47 94 50 Z" fill="#ff9e8a"/>
