<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -14 108 114" role="img" aria-label="Lobey holding a letter">
<style>
.body { transform-box: view-box; transform-origin: 50px 84px; }
.eye { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
.shadow { transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.1); } }

.body { animation: bob 2.6s ease-in-out infinite; }
.env { transform-box: view-box; transform-origin: 72px 82px; animation: wiggle 2.6s ease-in-out infinite; }
.heart { transform-box: fill-box; transform-origin: center; animation: rise 2.6s ease-out infinite; opacity: 0; }
.h2 { animation-delay: 1.3s; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes wiggle { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(4deg); } }
@keyframes rise { 0% { opacity: 0; transform: translate(0,6px) scale(.5); } 20% { opacity: 1; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(4px,-22px) scale(.8); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
