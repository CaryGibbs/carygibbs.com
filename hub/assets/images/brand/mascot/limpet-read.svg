#2a9d8f"/><path d="M50 73 Q61 68 74 70 L74 90 Q61 88 50 93 Z" fill="#23867a"/><path d="M50 72 L50 94" stroke="#1b6d63" stroke-width="3" stroke-linecap="round"/><path transform="translate(38 79) scale(.75)" d="M0 -6 L1.8 -1.9 L6 -1.6 L2.8 1.2 L3.7 5.5 L0 3.2 L-3.7 5.5 L-2.8 1.2 L-6 -1.6 L-1.8 -1.9 Z" fill="#ffc94a"/><g stroke="#bfe7e1" stroke-width="1.6" stroke-linecap="round" opacity=".8"><path d="M57 79 L69 78"/><path d="M57 83 L66 82.5"/></g><ellipse cx="25" cy="81" rx="4.2" ry="5.5" fill="#ff7a59" stroke="#c94a28" stroke-width="2"/><ellipse cx="75" cy="81" rx="4.2" ry="5.5" fill="#ff7a59" stroke="#c94a28" stroke-width="2"/></g></g>
