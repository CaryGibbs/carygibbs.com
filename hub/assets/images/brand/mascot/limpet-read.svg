<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -14 108 114" role="img" aria-label="Lobe Limpet reading a book">
<style>
.body { transform-box: view-box; transform-origin: 50px 84px; }
.eye { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
.shadow { transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.1); } }

.body { animation: sway 4s ease-in-out infinite; }
.pupil { animation: read 4s ease-in-out infinite; }
.page { transform-box: view-box; transform-origin: 50px 0; animation: turn 4s ease-in-out infinite; }
.fold { animation: think 4s ease-in-out infinite; }
.f2 { animation-delay: .2s; } .f3 { animation-delay: .4s; } .f4 { animation-delay: .6s; } .f5 { animation-delay: .8s; }
@keyframes sway { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
@keyframes read { 0%,10% { transform: translate(-2px,3px); } 35% { transform: translate(2px,3px); } 40% { transform: translate(-2px,4px); } 65% { transform: translate(2px,4px); } 75%,100% { transform: translate(-2px,3px); } }
@keyframes turn { 0%,78% { transform: scaleX(1); } 88% { transform: scaleX(0); } 98%,100% { transform: scaleX(-1); } }
@keyframes think { 0%,70%,100% { stroke: #c94a28; } 85% { stroke: #ffd36b; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
