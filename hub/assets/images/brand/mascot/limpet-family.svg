<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 -14 146 114" role="img" aria-label="Lobey with a little Lobey">
<style>
.body { transform-box: view-box; transform-origin: 50px 84px; }
.eye { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
.shadow { transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.1); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.big { transform-box: view-box; transform-origin: 50px 84px; animation: lean 3.2s ease-in-out infinite; }
.small { transform-box: view-box; transform-origin: 50px 84px; animation: bob 1.6s ease-in-out infinite; }
.e2 { animation-delay: 1.7s; }
.heart { transform-box: fill-box; transform-origin: center; animation: rise 3.2s ease-out infinite; opacity: 0; }
.h2 { animation-delay: 1.6s; }
@keyframes lean { 0%,100% { transform: rotate(0); } 45%,60% { transform: rotate(4deg); } }
@keyframes rise { 0% { opacity: 0; transform: translate(0,6px) scale(.5); } 20% { opacity: 1; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(-3px,-22px) scale(.8); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
