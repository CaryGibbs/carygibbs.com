<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -14 108 114" role="img" aria-label="Lobe Limpet fast asleep">
<style>
.body { transform-box: view-box; transform-origin: 50px 84px; }
.eye { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
.shadow { transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.1); } }

.body { animation: breathe 4s ease-in-out infinite; }
.mouth { transform-box: fill-box; transform-origin: center; animation: snore 4s ease-in-out infinite; }
.z { opacity: 0; animation: z 4s ease-out infinite; }
.z1 { animation-delay: .6s; } .z2 { animation-delay: 1.2s; }
.cap { transform-box: view-box; transform-origin: 50px 14px; animation: flop 4s ease-in-out infinite; }
@keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.03,1.05); } }
@keyframes snore { 0%,100% { transform: scale(.7); } 50% { transform: scale(1.15); } }
@keyframes z { 0% { opacity: 0; transform: translate(0,4px); } 25% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(6px,-8px); } }
@keyframes flop { 0%,100% { transform: rotate(0); } 50% { transform: rotate(3deg); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
