"/></g></g><path class="spark" transform="translate(12 6)" d="M0 -6 Q1.5 -1.5 6 0 Q1.5 1.5 0 6 Q-1.5 1.5 -6 0 Q-1.5 -1.5 0 -6 Z" fill="#ffc94a"/>
