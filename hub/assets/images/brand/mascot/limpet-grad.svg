<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -14 108 114" role="img" aria-label="Lobe Limpet in a graduation cap">
<style>
.body { transform-box: view-box; transform-origin: 50px 84px; }
.eye { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
.shadow { transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.1); } }

.body { animation: nod 3s ease-in-out infinite; }
.tassel { transform-box: view-box; transform-origin: 72px 3px; animation: swing 3s ease-in-out infinite; }
.spark { transform-box: fill-box; transform-origin: center; animation: spark 3s ease-in-out infinite; opacity: 0; }
@keyframes nod { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-3deg) translateY(-2px); } 40% { transform: rotate(2deg); } 60% { transform: rotate(0); } }
@keyframes swing { 0%,100% { transform: rotate(-10deg); } 20% { transform: rotate(18deg); } 40% { transform: rotate(-14deg); } 60% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); } }
@keyframes spark { 0%,45% { opacity: 0; transform: scale(.2) rotate(0); } 60% { opacity: 1; transform: scale(1) rotate(45deg); } 75%,100% { opacity: 0; transform: scale(.3) rotate(90deg); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
