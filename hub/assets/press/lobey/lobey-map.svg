<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -14 108 114" role="img" aria-label="Lobey reading a map">
<style>
.body { transform-box: view-box; transform-origin: 50px 84px; }
.eye { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
.shadow { transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.1); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.body { animation: bob 2.6s ease-in-out infinite; }
.map { transform-box: view-box; transform-origin: 74px 86px; animation: tilt 2.6s ease-in-out infinite; }
.path { stroke-dasharray: 3 3; animation: march 1.4s linear infinite; }
.star { transform-box: fill-box; transform-origin: center; animation: twinkle 1.4s ease-in-out infinite; }
.spark { transform-box: fill-box; transform-origin: center; animation: twinkle 1.4s ease-in-out .7s infinite; }
@keyframes tilt { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(3deg); } }
@keyframes march { to { stroke-dashoffset: -12; } }
@keyframes twinkle { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.3) rotate(15deg); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
