<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -14 108 114" role="img" aria-label="Lobey thinking, then getting an idea">
<style>
.body { transform-box: view-box; transform-origin: 50px 84px; }
.eye { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
.shadow { transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.1); } }

.body { animation: tilt 5s ease-in-out infinite; }
.pupil { animation: look 5s ease-in-out infinite; }
.q { transform-box: fill-box; transform-origin: center bottom; animation: q 5s ease-in-out infinite; }
.bulb { transform-box: fill-box; transform-origin: center; animation: bulb 5s ease-in-out infinite; opacity: 0; }
.hmm { animation: hmm 5s infinite; } .yay { animation: yay 5s infinite; opacity: 0; }
.fold { animation: glow 5s ease-in-out infinite; }
@keyframes tilt { 0%,50% { transform: rotate(-4deg); } 58%,90% { transform: rotate(0) translateY(-3px); } 100% { transform: rotate(-4deg); } }
@keyframes look { 0%,50% { transform: translate(2px,-2px); } 58%,100% { transform: translate(0,0); } }
@keyframes q { 0% { opacity: 0; transform: translateY(4px) rotate(-8deg); } 10%,45% { opacity: 1; transform: translateY(0) rotate(8deg); } 30% { transform: translateY(-2px) rotate(-6deg); } 52%,100% { opacity: 0; transform: translateY(-6px); } }
@keyframes bulb { 0%,52% { opacity: 0; transform: scale(.3); } 60% { opacity: 1; transform: scale(1.15); } 66%,88% { opacity: 1; transform: scale(1); } 96%,100% { opacity: 0; transform: scale(.6); } }
@keyframes hmm { 0%,52% { opacity: 1; } 56%,96% { opacity: 0; } 100% { opacity: 1; } }
@keyframes yay { 0%,52% { opacity: 0; } 56%,96% { opacity: 1; } 100% { opacity: 0; } }
@keyframes glow { 0%,55%,92%,100% { stroke: #c94a28; } 62%,86% { stroke: #ffd36b; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
