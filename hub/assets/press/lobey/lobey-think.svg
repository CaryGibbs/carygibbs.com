><g class="bulb"><g stroke="#ffc94a" stroke-width="2" stroke-linecap="round"><path d="M84 -12 L84 -9"/><path d="M73 -6 L75.5 -4.5"/><path d="M95 -6 L92.5 -4.5"/></g><path d="M84 -7 C77 -7 75 1 79 5 C80.5 6.5 80.5 8 80.5 9 L87.5 9 C87.5 8 87.5 6.5 89 5 C93 1 91 -7 84 -7 Z" fill="#ffd36b" stroke="#e0a82e" stroke-width="1.2"/><rect x="80.5" y="9.5" width="7" height="4" rx="1" fill="#8aa1ab"/></g>
</svg>
