<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -14 140 114" role="img" aria-label="Lobey lifting his shell to reveal a new badge">
<style>.eye { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
@keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.1); } }
.bp-shell { transform-box: view-box; transform-origin: 14px 84px; animation: lift 3.2s ease-in-out infinite; }
.glow { animation: glow 3.2s ease-in-out infinite; opacity: 0; }
.medal { transform-box: view-box; transform-origin: 50px 80px; animation: pop 3.2s cubic-bezier(.3,1.4,.5,1) infinite; }
.medal-in { transform-box: fill-box; transform-origin: center; animation: spin 3.2s ease-in-out infinite; }
@keyframes lift { 0%, 8% { transform: none; } 16% { transform: translateY(1px) scale(1.03,.96); } 32%, 74% { transform: translate(-3px,-12px) rotate(-14deg); } 88%, 100% { transform: none; } }
@keyframes glow { 0%, 16% { opacity: 0; } 32%, 74% { opacity: .9; } 88%, 100% { opacity: 0; } }
@keyframes pop { 0%, 22% { transform: translateY(0) scale(.25); opacity: 0; } 26% { opacity: 1; } 42% { transform: translate(52px,-26px) scale(1.15); opacity: 1; } 50%, 70% { transform: translate(50px,-22px) scale(1); opacity: 1; } 84% { transform: translate(8px,-2px) scale(.3); opacity: 1; } 86%, 100% { transform: translateY(0) scale(.25); opacity: 0; } }
@keyframes spin { 0%, 48% { transform: rotateY(0); } 62%, 100% { transform: rotateY(360deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .medal { transform: translate(50px,-22px); } .bp-shell { transform: translate(-3px,-12px) rotate(-14deg); } .glow { opacity: .9; } }</style>
